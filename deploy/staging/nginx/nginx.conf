worker_processes 2;
worker_shutdown_timeout 5s;
worker_rlimit_nofile 16384;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 8192; }

http {
    # Docker-Service-Adressen bleiben bei Container-Recreation dynamisch.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    include /var/lib/nginx/staging/pools.conf;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream app_yjs {
        zone arsnova_yjs 64k;
        server yjs-relay:3002 resolve;
    }

    # Keine Querystrings, Client-Adressen oder Zugangsdaten im Access-Log.
    log_format staging '$msec $status $uri $upstream_addr $request_time';
    access_log /dev/stdout staging;

    proxy_http_version 1.1;
    proxy_next_upstream off;
    client_max_body_size 8m;

    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            include /etc/nginx/staging/proxy-headers.conf;
            proxy_set_header Connection "";
            proxy_read_timeout 150s;
            proxy_pass http://app_http;
        }

        location = /trpc-ws {
            include /etc/nginx/staging/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_pass http://app_ws/;
        }

        location = /yjs-ws { return 404; }
        location ^~ /yjs-ws/ {
            # Der Upgrade-Querystring enthält eine Capability und darf auch bei 502 nicht im Log landen.
            access_log off;
            error_log /dev/null crit;
            if ($http_upgrade !~* ^websocket$) { return 404; }
            include /etc/nginx/staging/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 75s;
            proxy_pass http://app_yjs/;
        }
    }

    # Nur im Nginx-Container für Reload-Bestätigung und HTTP-Readiness erreichbar.
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /mode { return 200 "$staging_pool\n"; }
        location = /ready { proxy_pass http://app_http/trpc/health.check; }
        location / { return 404; }
    }
}
