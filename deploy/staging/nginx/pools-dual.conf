map $request_uri $staging_pool { default dual; }

upstream app_http {
    zone arsnova_http_dual 64k;
    least_conn;
    server app-a:3000 resolve;
    server app-b:3000 resolve;
    keepalive 64;
}
upstream app_ws {
    zone arsnova_ws_dual 64k;
    least_conn;
    server app-a:3001 resolve;
    server app-b:3001 resolve;
}
