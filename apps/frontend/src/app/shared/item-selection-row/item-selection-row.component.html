<div class="item-selection-row" [class.item-selection-row--done]="!!selectedId">
  <div class="item-selection-row__item markdown-body" [innerHTML]="renderMarkdown(itemText)"></div>
  <mat-form-field
    appearance="outline"
    class="item-selection-row__field"
    (click)="openSelectionFromField($event, selectionControl)"
  >
    <mat-label>{{ selectLabel }}</mat-label>
    <mat-select
      #selectionControl
      [value]="selectedId"
      [aria-label]="selectAriaLabel"
      [disabled]="disabled"
      (selectionChange)="confirmSelection($event.value, selectionControl)"
    >
      <mat-select-trigger>
        <span class="markdown-body" [innerHTML]="renderMarkdown(selectedText())"></span>
      </mat-select-trigger>
      @for (option of options; track option.id) {
        <mat-option [value]="option.id">
          <span class="markdown-body" [innerHTML]="renderMarkdown(option.text)"></span>
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
