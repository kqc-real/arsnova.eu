# =============================================================================
# arsnova.eu – Produktion (Debian Root-Server)
# Voraussetzung: `.env.production` liegt im selben Verzeichnis wie diese Datei (nicht im Git).
# Start: docker compose -f docker-compose.prod.yml up -d
# (Optional weiterhin: --env-file .env.production, falls die Datei woanders liegt.)
#
# Hinweis: Früher wurden Secrets per `environment: ADMIN_SECRET: ${ADMIN_SECRET}` eingespeist.
# Ohne `docker compose --env-file …` war `${ADMIN_SECRET}` leer und hat den Admin-Login gebrochen.
# `env_file` lädt die Werte zuverlässig direkt aus `.env.production` in den Container.
# Ports nur auf 127.0.0.1 gebunden → Nginx als einziger Einstieg (TLS, Reverse Proxy)
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: arsnova-v3-postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arsnova_user -d arsnova_v3']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: arsnova-v3-redis
    restart: always
    volumes:
      - redis_data:/data
    # AOF everysec hält allgemeine Redis-Last günstig; sicherheitskritische
    # Yjs-Create/Rotate-Pfade erzwingen vor ihrer Antwort gezielt WAITAOF.
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel warning
    networks:
      - app
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  pdf-worker:
    image: ${ARSNOVA_IMAGE:?ARSNOVA_IMAGE must be set to a digest image ref}
    container_name: arsnova-v3-pdf-worker
    restart: always
    init: true
    entrypoint: ['node', 'apps/backend/dist/pdf-worker.js']
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 128
    mem_limit: 1g
    cpus: '1.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - pdf_worker_socket:/run/pdf-worker
    environment:
      NODE_ENV: 'production'
      HOME: /tmp
      PDF_WORKER_SOCKET_PATH: /run/pdf-worker/render.sock
      PDF_WORKER_RENDER_TIMEOUT_MS: '60000'
    healthcheck:
      test: ['CMD', 'node', '/app/scripts/pdf-worker-healthcheck.mjs']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  app:
    image: ${ARSNOVA_IMAGE:?ARSNOVA_IMAGE must be set to a digest image ref}
    container_name: arsnova-v3-app
    restart: always
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - pdf_worker_socket:/run/pdf-worker:ro
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:3001'
      - '127.0.0.1:3002:3002'
    environment:
      # Fixe Laufzeitwerte; DATABASE_URL, REDIS_URL, JWT_SECRET, ADMIN_* kommen aus `.env.production`
      PORT: '3000'
      HOST: '0.0.0.0'
      WS_PORT: '3001'
      YJS_WS_PORT: '3002'
      NODE_ENV: 'production'
      PDF_RENDER_MODE: worker
      PDF_WORKER_SOCKET_PATH: /run/pdf-worker/render.sock
    depends_on:
      pdf-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/trpc/health.check']
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pdf_worker_socket:
