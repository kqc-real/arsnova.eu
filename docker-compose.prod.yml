# =============================================================================
# arsnova.eu – Produktion (Debian Root-Server)
# Voraussetzung: `.env.production` liegt im selben Verzeichnis wie diese Datei (nicht im Git).
# `app`/`pdf-worker` brauchen ARSNOVA_IMAGE (Digest). Nach Deploy: `.env.arsnova-image`
# oder Wrapper: `./scripts/prod-compose.sh up -d`
#
# Hinweis: Früher wurden Secrets per `environment: ADMIN_SECRET: ${ADMIN_SECRET}` eingespeist.
# Ohne `docker compose --env-file …` war `${ADMIN_SECRET}` leer und hat den Admin-Login gebrochen.
# `env_file` lädt die Werte zuverlässig direkt aus `.env.production` in den Container.
# Ports nur auf 127.0.0.1 gebunden → Nginx als einziger Einstieg (TLS, Reverse Proxy)
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: arsnova-v3-postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arsnova_user -d arsnova_v3']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: arsnova-v3-redis
    restart: always
    volumes:
      - redis_data:/data
    # AOF everysec hält allgemeine Redis-Last günstig; sicherheitskritische
    # Yjs-Create/Rotate-, Session-Snapshot-Purge- und Word-Cloud-Rollout-Sweep-
    # Pfade erzwingen vor ihrer Bestätigung beziehungsweise vor dem DB-Delete
    # gezielt WAITAOF.
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel warning
    networks:
      - app
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  pdf-worker:
    image: ${ARSNOVA_IMAGE:?ARSNOVA_IMAGE must be set to a digest image ref}
    container_name: arsnova-v3-pdf-worker
    restart: always
    init: true
    entrypoint: ['node', 'apps/backend/dist/pdf-worker.js']
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    # Der Cgroup-Zähler umfasst auch Chromiums Threads.
    pids_limit: 256
    mem_limit: 1g
    cpus: '1.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - pdf_worker_socket:/run/pdf-worker
    environment:
      NODE_ENV: 'production'
      HOME: /tmp
      PDF_WORKER_SOCKET_PATH: /run/pdf-worker/render.sock
      PDF_WORKER_RENDER_TIMEOUT_MS: '60000'
    healthcheck:
      test: ['CMD', 'node', '/app/scripts/pdf-worker-healthcheck.mjs']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  # Optionale Textanalyse: Ersteinrichtung per Compose, Updates über scripts/prod-text-sidecars.sh.
  spacy:
    profiles: ['nlp']
    image: ${SPACY_IMAGE:-arsnova-spacy:3.8.15}
    container_name: arsnova-v3-spacy
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    mem_limit: 1g
    cpus: '1.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - spacy_socket:/run/spacy
    environment:
      HOME: /tmp
      NLP_SOCKET_PATH: /run/spacy/nlp.sock
    healthcheck:
      test: ['CMD', 'python', '/app/healthcheck.py']
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 5
    stop_grace_period: 10s

  # Encoder-Updates gemeinsam mit spaCy über scripts/prod-text-sidecars.sh.
  wordcloud-encoder:
    profiles: ['encoder']
    image: ${WORD_CLOUD_ENCODER_IMAGE:-arsnova-wordcloud-encoder:e5-small}
    container_name: arsnova-v3-wordcloud-encoder
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    mem_limit: 2g
    cpus: '4.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - wordcloud_encoder_socket:/run/wordcloud-encoder
    environment:
      HOME: /tmp
      WORD_CLOUD_ENCODER_SOCKET_PATH: /run/wordcloud-encoder/encoder.sock
      WORD_CLOUD_ENCODER_MODEL_DIR: /models/e5-small
    healthcheck:
      test: ['CMD', 'python', '/app/healthcheck.py']
      interval: 15s
      timeout: 3s
      start_period: 120s
      retries: 5
    stop_grace_period: 10s

  # Ausschließlich Same-Host-Labor. Nicht zusammen mit nlp+encoder auf dem
  # 16-GB-Live-Host starten. Kanonische Produktion: docker-compose.llm.yml
  # auf einem zweiten privaten Host. deploy.sh startet dieses Profil nicht.
  open-weight-llm:
    profiles: ['llm']
    image: ${OPEN_WEIGHT_LLM_IMAGE:-arsnova-open-weight-llm:llama-b10524}
    container_name: arsnova-v3-open-weight-llm
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 128
    mem_limit: 5g
    cpus: '4.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - open_weight_llm_socket:/run/open-weight-llm
      - ${OPEN_WEIGHT_LLM_MODEL_DIR:-./models/open-weight-llm}:/models:ro
    environment:
      OPEN_WEIGHT_LLM_TRANSPORT: unix
      OPEN_WEIGHT_LLM_SOCKET_PATH: /run/open-weight-llm/llm.sock
      OPEN_WEIGHT_LLM_TOKEN: ${OPEN_WEIGHT_LLM_TOKEN:-}
      OPEN_WEIGHT_LLM_THREADS: '4'
    healthcheck:
      test: ['CMD', '/opt/arsnova/healthcheck.sh']
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    stop_grace_period: 10s

  app: &production-app
    image: ${ARSNOVA_IMAGE:?ARSNOVA_IMAGE must be set to a digest image ref}
    container_name: arsnova-v3-app
    restart: always
    group_add:
      - '65532'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - pdf_worker_socket:/run/pdf-worker:ro
      - spacy_socket:/run/spacy:ro
      - wordcloud_encoder_socket:/run/wordcloud-encoder:ro
      - open_weight_llm_socket:/run/open-weight-llm:ro
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:3001'
      - '127.0.0.1:3002:3002'
    environment: &production-app-env
      # Fixe Laufzeitwerte; DATABASE_URL, REDIS_URL, JWT_SECRET,
      # CAPABILITY_ENVELOPE_KEY_BASE64, STRUCTURED_SHUFFLE_SECRET und ADMIN_*
      # kommen aus `.env.production`
      PORT: '3000'
      HOST: '0.0.0.0'
      WS_PORT: '3001'
      YJS_WS_PORT: '3002'
      NODE_ENV: 'production'
      PDF_RENDER_MODE: worker
      PDF_WORKER_SOCKET_PATH: /run/pdf-worker/render.sock
      NLP_SOCKET_PATH: /run/spacy/nlp.sock
      NLP_TIMEOUT_MS: '5000'
      NLP_CACHE_TTL_SECONDS: '1800'
      WORD_CLOUD_ENCODER_SOCKET_PATH: /run/wordcloud-encoder/encoder.sock
      WORD_CLOUD_ENCODER_TIMEOUT_MS: '120000'
      WORD_CLOUD_ENCODER_CACHE_TTL_SECONDS: '1800'
      # Sessiongebundene Blitzlicht-, ProductFeedback-, Presence-,
      # Lesebereitschafts- und Host-Pairing-Purges sind wegen
      # NODE_ENV=production immer per Redis-WAITAOF abgesichert; es gibt hier
      # keinen abschaltbaren Schalter.
      # NLP_ENABLED kommt aus `.env.production` (Default false).
      # Sidecar nur mit Compose-Profil `nlp` starten; deploy.sh startet ihn nicht.
      # QA_NLP_ENABLED kommt aus `.env.production` (Default false). Story 8.9b:
      # asynchrone Q&A-Klassifikation, getrennt von spaCy; Gatekeeper plus Seed-Kalibrierung.
      # QA_SUMMARY_ENABLED kommt aus `.env.production` (Default false). Story 8.9c:
      # optionale Moderationszusammenfassung, getrennt von QA_NLP_ENABLED; ohne
      # private QA_SUMMARY_INFERENCE_URL kein Cloud-Fallback.
      # WORD_CLOUD_SEMANTIC_ENABLED kommt aus `.env.production` (Default false).
      # Encoder nur mit Compose-Profil `encoder`; deploy.sh startet ihn nicht.
      # OPEN_WEIGHT_LLM_ENABLED kommt aus `.env.production` (Default false).
      # Das llm-Profil hier ist nur Labor; kanonische Produktion läuft auf
      # einem zweiten privaten Host und wird bewusst separat gestartet.
      # OPEN_WEIGHT_LLM_URL (zweiter Host) und OPEN_WEIGHT_LLM_SOCKET_PATH
      # (Same-Host-Labor) kommen exklusiv aus `.env.production`.
    depends_on:
      open-weight-llm:
        condition: service_healthy
        required: false
      pdf-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/trpc/health.check']
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  # Über scripts/prod-replicas.sh starten. Nur App A wendet Migrationen und
  # den Rollout-Purge über den Produktions-Entrypoint an.
  app-b: &production-replica
    <<: *production-app
    profiles: ['app-replicas']
    container_name: arsnova-v3-app-b
    restart: unless-stopped
    init: true
    entrypoint: ['node', 'apps/backend/dist/index.js']
    command: []
    ports:
      - '127.0.0.1:13100:3000'
      - '127.0.0.1:13101:3001'
    environment:
      <<: *production-app-env
      DATABASE_POOL_MAX: ${ARSNOVA_REPLICA_POOL_MAX:-30}
      SESSION_STATUS_PUBSUB_ENABLED: 'true'
      TRPC_WS_SHARED_LIMITS_ENABLED: 'true'
      REDIS_RECONNECT_CONTINUOUS: 'true'
      YJS_RELAY_MODE: external
      PDF_SHARED_LIMIT_ENABLED: 'true'
      OPEN_WEIGHT_LLM_SHARED_SLOT_ENABLED: 'true'
      SESSION_CLEANUP_SCHEDULER_ENABLED: 'false'
    stop_grace_period: 30s

  app-c:
    <<: *production-replica
    profiles: ['app-third']
    container_name: arsnova-v3-app-c
    ports:
      - '127.0.0.1:13300:3000'
      - '127.0.0.1:13301:3001'

  yjs-relay:
    profiles: ['app-replicas']
    image: ${ARSNOVA_IMAGE:?ARSNOVA_IMAGE must be set to a digest image ref}
    container_name: arsnova-v3-yjs-relay
    restart: unless-stopped
    init: true
    entrypoint: ['node', 'apps/backend/dist/yjsRelayMain.js']
    command: []
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_RECONNECT_CONTINUOUS: 'true'
      YJS_WS_HOST: '0.0.0.0'
      YJS_WS_PORT: '3002'
    networks:
      - app
    ports:
      - '127.0.0.1:13202:3002'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', '-T', '3', 'http://127.0.0.1:3002/']
      interval: 5s
      timeout: 4s
      retries: 6
    stop_grace_period: 15s

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pdf_worker_socket:
  spacy_socket:
  wordcloud_encoder_socket:
  open_weight_llm_socket:
