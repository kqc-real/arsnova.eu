services:
  # PostgreSQL Datenbank (Für Prisma ORM)
  postgres:
    image: postgres:16-alpine
    container_name: arsnova-v3-postgres
    restart: always
    environment:
      POSTGRES_USER: arsnova_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: arsnova_v3_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arsnova_user -d arsnova_v3_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Für tRPC Pub/Sub & WebSockets)
  redis:
    image: redis:7.4-alpine
    container_name: arsnova-v3-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend + Frontend (Multi-Stage Dockerfile)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arsnova-v3-app
    restart: always
    ports:
      - '3000:3000'
      - '3001:3001'
      - '3002:3002'
    environment:
      DATABASE_URL: 'postgresql://arsnova_user:secretpassword@postgres:5432/arsnova_v3_dev?schema=public'
      REDIS_URL: 'redis://redis:6379'
      PORT: '3000'
      HOST: '0.0.0.0'
      WS_PORT: '3001'
      YJS_WS_PORT: '3002'
      NODE_ENV: 'production'
      PUBLIC_FRONTEND_URL: 'http://127.0.0.1:3000'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: '/usr/bin/chromium'
      NLP_ENABLED: 'false'
      NLP_SOCKET_PATH: /run/spacy/nlp.sock
      NLP_TIMEOUT_MS: '5000'
      NLP_CACHE_TTL_SECONDS: '1800'
    volumes:
      - spacy_socket:/run/spacy:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/trpc/health.check']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Optionaler spaCy-Sidecar (Story 1.14b, umgesetzt). Start: docker compose --profile nlp up -d
  spacy:
    profiles: ['nlp']
    build:
      context: ./docker/spacy
      dockerfile: Dockerfile
    container_name: arsnova-v3-spacy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    mem_limit: 1g
    cpus: '1.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - spacy_socket:/run/spacy
    environment:
      HOME: /tmp
      NLP_SOCKET_PATH: /run/spacy/nlp.sock
    healthcheck:
      test: ['CMD', 'python', '/app/healthcheck.py']
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  spacy_socket:
