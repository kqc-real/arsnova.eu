name: PR Template

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

jobs:
  validate-pr-body:
    name: PR-Template vollständig
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validierungslogik testen
        run: node --test .github/scripts/validate-pr-template.test.mjs

      - name: PR-Beschreibung prüfen
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/validate-pr-template.mjs
