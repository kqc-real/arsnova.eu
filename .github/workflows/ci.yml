# =============================================================================
# arsnova.eu – CI & Deploy (GitHub Actions)
# Story 0.6: Build, Lint, Validate, Audit, Docker
# Deploy: Nur bei Push auf main, nach allen Tests; optional eigener Branch (s. unten).
# =============================================================================

name: CI · Build & Tests

run-name: >-
  CI · ${{
    github.event_name == 'schedule' && 'Nightly' ||
    github.event_name == 'workflow_dispatch' && 'Manual' ||
    github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) ||
    github.ref_name
  }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      artillery_participants:
        description: 'Teilnehmende für Artillery (500 Kapazitätsstandard)'
        required: false
        default: '500'
        type: string
      artillery_ramp_seconds:
        description: 'Ramp-up-Dauer für Artillery'
        required: false
        default: '60'
        type: string
      run_production_load:
        description: 'Explizit den k6-Health-Lasttest gegen Produktion ausführen'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Deploy-Branch: Standard ist main. Optional Repository-Variable DEPLOY_BRANCH setzen (z. B. deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Docs-only PRs: Jobs laufen weiter (Ruleset-Pflichtchecks behalten Matrix-Namen),
  # schwere Steps werden per Step-if übersprungen (Fast Pass statt job-level skip).

  # ─── Change Filter ────────────────────────────────────────────────────────
  changes:
    name: Change Filter
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docs_only=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE" =~ ^0{40}$ ]]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # HEAD_SHA is provided through the step environment.
            base_sha="$PUSH_BEFORE"
            # shellcheck disable=SC2153
            head_sha="$HEAD_SHA"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")
          if (( ${#changed_files[@]} > 0 )); then
            docs_only=true
            for file in "${changed_files[@]}"; do
              if [[ "$file" == docs/* || "$file" == *.md ]]; then
                continue
              fi
              docs_only=false
              break
            done
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Changed files (%s):\n' "${#changed_files[@]}"
          if (( ${#changed_files[@]} > 0 )); then
            printf ' - %s\n' "${changed_files[@]}"
          fi

  # ─── Dependency Review (PR) ────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high

  # ─── Workflow Lint (GitHub Actions) ───────────────────────────────────────
  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7

      - name: Validate operations scripts and systemd units
        run: |
          bash -n scripts/backup/*.sh
          bash -n scripts/backup/tests/*.sh
          bash -n scripts/ci/*.sh
          bash -n scripts/deploy.sh scripts/deploy/*.sh
          shellcheck scripts/backup/*.sh scripts/backup/tests/*.sh scripts/ci/*.sh scripts/deploy.sh scripts/deploy/*.sh
          node --test scripts/ci/*.test.mjs scripts/deploy/*.test.mjs
          python3 -m py_compile scripts/monitoring/arsnova_monitor.py
          python3 -m unittest discover -s scripts/monitoring/tests -p 'test_*.py'
          python3 -m py_compile docker/spacy/server.py docker/spacy/healthcheck.py
          python3 -m unittest discover -s docker/spacy/tests -p 'test_*.py'
          python3 -m py_compile docker/wordcloud-encoder/server.py docker/wordcloud-encoder/healthcheck.py docker/wordcloud-encoder/embed.py
          python3 -m unittest discover -s docker/wordcloud-encoder/tests -p 'test_*.py'
          docker run --rm \
            -e ARSNOVA_BACKUP_TEST_CONTAINER=1 \
            -v "$PWD:/repo:ro" \
            debian:12-slim \
            bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq restic openssh-client openssh-server >/dev/null && /repo/scripts/backup/tests/restic-sftp-integration.sh'
          scripts/backup/tests/postgres-readiness-integration.sh
          sudo install -o root -g root -m 0750 scripts/backup/*.sh /usr/local/sbin/
          sudo install -o root -g root -m 0755 \
            scripts/monitoring/arsnova_monitor.py \
            /usr/local/sbin/arsnova-monitor
          sudo install -o root -g root -m 0700 -d \
            /etc/arsnova-backup \
            /etc/arsnova-monitoring \
            /var/lib/arsnova-backup \
            /var/lib/arsnova-restore-check \
            /var/cache/arsnova-restic
          sudo systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
          systemd-analyze calendar \
            '*-*-* 02:30:00' \
            'Sun *-*-01..07 05:15:00' \
            '*-*-* *:*:00'
          sudo install -o root -g root -m 0644 deploy/systemd/*.service /etc/systemd/system/
          sudo install -o root -g root -m 0700 -d \
            /etc/systemd/system/arsnova-backup.service.d \
            /etc/systemd/system/arsnova-monitor.service.d \
            /etc/systemd/system/arsnova-restore-check.service.d \
            /home/deploy/arsnova.eu
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'exec 8>/run/lock/arsnova-restic.lock' \
            'flock -n 8' \
            | sudo tee /usr/local/sbin/arsnova-systemd-lock-smoke.sh >/dev/null
          sudo chmod 0750 /usr/local/sbin/arsnova-systemd-lock-smoke.sh
          printf '[Service]\nExecStart=\nExecStart=/usr/local/sbin/arsnova-systemd-lock-smoke.sh\n' \
            | sudo tee /etc/systemd/system/arsnova-backup.service.d/smoke.conf >/dev/null
          printf '[Service]\nExecStart=\nExecStart=/usr/local/sbin/arsnova-systemd-lock-smoke.sh\n' \
            | sudo tee /etc/systemd/system/arsnova-restore-check.service.d/smoke.conf >/dev/null
          printf '[Service]\nExecStart=\nExecStart=/usr/local/sbin/arsnova-monitor --dry-run\n' \
            | sudo tee /etc/systemd/system/arsnova-monitor.service.d/smoke.conf >/dev/null
          sudo touch /etc/arsnova-backup/backup.env
          sudo chown root:root /etc/arsnova-backup/backup.env
          sudo chmod 0600 /etc/arsnova-backup/backup.env
          printf 'ADMIN_DIAGNOSTIC_SECRET=%064d\n' 0 \
            | sudo tee /etc/arsnova-monitoring/monitor.env >/dev/null
          sudo chown root:root /etc/arsnova-monitoring/monitor.env
          sudo chmod 0600 /etc/arsnova-monitoring/monitor.env
          sudo systemctl daemon-reload
          sudo chmod 0644 /etc/arsnova-monitoring/monitor.env
          if sudo systemctl start arsnova-monitor.service; then
            echo "Monitoring-Unit akzeptiert eine zu offene Secret-Datei." >&2
            exit 1
          fi
          sudo systemctl reset-failed arsnova-monitor.service
          sudo chmod 0600 /etc/arsnova-monitoring/monitor.env
          sudo systemctl start arsnova-backup.service
          sudo systemctl start arsnova-restore-check.service
          python3 scripts/monitoring/tests/trpc_fixture_server.py &
          monitor_fixture_pid=$!
          trap 'kill "$monitor_fixture_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:3000/trpc/health.check >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/trpc/health.check >/dev/null
          sudo systemctl start arsnova-monitor.service
          sudo test -d /var/lib/arsnova-monitoring
          sudo journalctl -u arsnova-monitor.service --since '-1 minute' --no-pager \
            | python3 -c 'import sys; assert "\"activeLevel\": \"ok\"" in sys.stdin.read()'
          kill "$monitor_fixture_pid"
          wait "$monitor_fixture_pid" 2>/dev/null || true
          trap - EXIT
          restore_fixture="$(mktemp -d)"
          installed_env="$(mktemp)"
          trap 'sudo rm -rf "$restore_fixture"; rm -f "$installed_env"' EXIT
          sudo chown root:root "$restore_fixture"
          sudo chmod 0700 "$restore_fixture"
          sudo install -o root -g root -m 0700 -d "$restore_fixture/snapshot/config"
          printf 'NODE_ENV=production\n' | sudo tee "$restore_fixture/snapshot/config/env.production" >/dev/null
          printf 'custom-dump\n' | sudo tee "$restore_fixture/snapshot/postgres.dump" >/dev/null
          if sudo -u nobody cat "$restore_fixture/snapshot/postgres.dump" >/dev/null 2>&1; then
            echo "Root-only Restore-Fixture ist ungeschützt." >&2
            exit 1
          fi
          restored_env="$(sudo find "$restore_fixture" -type f -path '*/config/env.production' -print -quit)"
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0600 "$restored_env" "$installed_env"
          test "$(stat -c '%u:%g:%a' "$installed_env")" = "$(id -u):$(id -g):600"
          dump="$(sudo find "$restore_fixture" -type f -name postgres.dump -print -quit)"
          sudo cat "$dump" | cmp - <(printf 'custom-dump\n')

  format:
    name: Changed Files Format
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed files with Prettier
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run format:check:changed

  migration:
    name: Migration Drift
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule'
    env:
      DATABASE_URL: postgresql://arsnova_user:secretpassword@localhost:5432/arsnova_v3_migration?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arsnova_user
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: arsnova_v3_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arsnova_user -d arsnova_v3_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping migration drift check."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Apply versioned migrations
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Reject migration/schema drift
        if: needs.changes.outputs.docs_only != 'true'
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Orphan quiz cleanup PostgreSQL regression
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: apps/backend
        env:
          RUN_PG_CLEANUP_TESTS: '1'
        run: npx vitest run src/__tests__/sessionCleanup.orphan-scope.pg.test.ts

      - name: Session finalization PostgreSQL race regression
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: apps/backend
        env:
          RUN_PG_SESSION_RACE_TESTS: '1'
        run: npx vitest run src/__tests__/session.finalization-race.pg.test.ts

  # ─── Build & Validate ────────────────────────────────────────────────────────
  build:
    name: Build & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping build."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js ${{ matrix.node-version }}
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Prisma validate
        if: needs.changes.outputs.docs_only != 'true'
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Prisma generate
        if: needs.changes.outputs.docs_only != 'true'
        run: npx prisma generate --schema prisma/schema.prisma

      - name: TypeScript build – shared-types + backend
        if: needs.changes.outputs.docs_only != 'true'
        run: npx tsc -b apps/backend/tsconfig.json && node scripts/fix-esm-imports.mjs

      - name: TypeScript compile – frontend
        if: needs.changes.outputs.docs_only != 'true'
        run: npx tsc --project apps/frontend/tsconfig.app.json --noEmit

      - name: Frontend localized production build (alle Locales)
        if: needs.changes.outputs.docs_only != 'true' && matrix.node-version == 24
        run: npm run build:localize -w @arsnova/frontend

      - name: Upload frontend production build
        if: needs.changes.outputs.docs_only != 'true' && matrix.node-version == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist-browser
          path: apps/frontend/dist/browser
          if-no-files-found: error
          retention-days: 1

  landing-build:
    name: Build Landing
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule'

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping landing build."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Check landing
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run check -w @arsnova/landing

      - name: Build landing
        if: needs.changes.outputs.docs_only != 'true'
        env:
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
          PUBLIC_SITE_URL: https://info.arsnova.eu/
          PUBLIC_APP_URL_V3: https://arsnova.eu
          BASE_PATH: /
        run: npm run build:landing

      - name: Landing i18n contract
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test:i18n -w @arsnova/landing

      - name: Landing theme static
        if: needs.changes.outputs.docs_only != 'true'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run test:theme-static -w @arsnova/landing

      - name: Install Playwright Chromium
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 16
        run: bash scripts/ci/playwright-install.sh chromium

      - name: Landing accessibility gate
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/landing-a11y"
          cp -R apps/landing/dist/. "$RUNNER_TEMP/landing-a11y/"
          node scripts/serve-static-compressed.mjs "$RUNNER_TEMP/landing-a11y" 4321 > "$RUNNER_TEMP/landing-static.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "http://localhost:4321/" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/landing-static.log"
              exit 1
            fi
            sleep 1
          done
          BASE_URL="http://localhost:4321" npm run test:a11y -w @arsnova/landing
          BASE_URL="http://localhost:4321" npm run test:language-switcher -w @arsnova/landing
          BASE_URL="http://localhost:4321" npm run test:theme-contrast -w @arsnova/landing
          BASE_URL="http://localhost:4321" npm run test:theme-switcher -w @arsnova/landing

  # Explizites `npm run typecheck` (Backend + Frontend, --noEmit) — ergänzt die
  # tsc-Schritte im build-Job; eigener Check in der PR-Übersicht, parallel zu build.
  typecheck:
    name: Typecheck (workspaces) (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping typecheck."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js ${{ matrix.node-version }}
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Prisma validate
        if: needs.changes.outputs.docs_only != 'true'
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Prisma generate
        if: needs.changes.outputs.docs_only != 'true'
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck (npm run typecheck)
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run typecheck

  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: github.event_name != 'schedule'

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping application lint; required-check validation remains active."

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Test script lint gates
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run lint:scripts:test

      - name: Validate required-check manifest and documentation
        run: npm run validate:required-checks:test && npm run validate:required-checks

      - name: Enforce changed script lint
        if: needs.changes.outputs.docs_only != 'true'
        env:
          SCRIPT_LINT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCRIPT_LINT_HEAD_SHA: ${{ github.sha }}
        run: npm run lint:scripts:changed

      - name: Check i18n locale consistency
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run check:i18n -w @arsnova/frontend

  # ─── Security Audit ──────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule'

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping audit."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js 24
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: npm audit (high severity gate)
        if: needs.changes.outputs.docs_only != 'true'
        run: npm audit --audit-level=high --omit=dev

      - name: Generate CycloneDX production SBOM
        if: needs.changes.outputs.docs_only != 'true'
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload production SBOM
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  # ─── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: github.event_name != 'schedule'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping tests."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Prisma generate
        if: needs.changes.outputs.docs_only != 'true'
        run: npx prisma generate --schema prisma/schema.prisma

      - name: tRPC DoD audit unit tests
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run audit:trpc-dod:test

      - name: tRPC DoD real-router full-coverage gate
        if: needs.changes.outputs.docs_only != 'true'
        run: >-
          npm run audit:trpc-dod --
          --fail-on-incomplete
          --json-out artifacts/trpc-dod/report.json
          --md-out artifacts/trpc-dod/report.md

      - name: Add tRPC DoD report to job summary
        if: always() && needs.changes.outputs.docs_only != 'true'
        run: cat artifacts/trpc-dod/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tRPC DoD report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trpc-dod-report
          path: artifacts/trpc-dod/
          if-no-files-found: error
          retention-days: 30

      - name: Install matching Playwright Chromium
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 16
        run: bash scripts/ci/playwright-install.sh chromium

      - name: Run tests with coverage gate
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test:coverage

      - name: Yjs share Redis 7 durability and crash regression
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: apps/backend
        env:
          REDIS_URL: redis://localhost:6381
          RUN_REDIS_YJS_SHARE_TESTS: '1'
          RUN_REDIS_YJS_DURABILITY_TESTS: '1'
          YJS_SHARE_REQUIRE_DURABILITY: '1'
          YJS_SHARE_TOKEN_SECRET: ci-yjs-share-secret-at-least-32-bytes
        run: |
          set -euo pipefail
          container=arsnova-yjs-durability-redis
          volume=arsnova-yjs-durability-data
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          start_redis() {
            docker run --detach --name "$container" \
              --publish 6381:6379 \
              --volume "$volume:/data" \
              redis:7.4-alpine \
              redis-server --appendonly yes --appendfsync everysec --save 60 1
            for _ in {1..30}; do
              if [[ "$(docker exec "$container" redis-cli ping 2>/dev/null || true)" == "PONG" ]]; then
                return
              fi
              sleep 1
            done
            docker logs "$container"
            exit 1
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          start_redis

          npx vitest run src/lib/yjsShareToken.redis.test.ts
          YJS_DURABILITY_TEST_PHASE=prepare \
            npx vitest run src/lib/yjsShareToken.durability.redis.test.ts

          docker kill --signal KILL "$container"
          docker rm "$container"
          start_redis

          YJS_DURABILITY_TEST_PHASE=verify \
            npx vitest run src/lib/yjsShareToken.durability.redis.test.ts

      - name: Upload coverage reports
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-reports
          path: |
            libs/shared-types/coverage
            apps/backend/coverage
            apps/frontend/coverage
          if-no-files-found: error
          retention-days: 7

