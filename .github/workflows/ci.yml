  # ─── Load Test (k6, scheduled/manual against production) ───────────────────
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && vars.PRODUCTION_LOAD_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.run_production_load)
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run k6 health load test against production
        uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec
        with:
          filename: scripts/load/k6-trpc-health-50vu.js
        env:
          BASE_URL: https://arsnova.eu

  # ─── Security Scan (Filesystem) ────────────────────────────────────────────
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'schedule'

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping Trivy FS."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Run Trivy FS scan
        if: needs.changes.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate Trivy FS SARIF report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'

      - name: Upload Trivy FS report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-fs-report
          path: trivy-fs.sarif
          if-no-files-found: error
          retention-days: 7

  # ─── Security Scan (Docker Image) ──────────────────────────────────────────
  # Scannt genau das vom Job „Docker Build“ exportierte Artefakt (kein zweiter Build).
  # Read-only: kein packages:write, kein GHCR-Login/Push (siehe publish-image).
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [changes, docker]
    if: github.event_name != 'schedule'
    permissions:
      contents: read

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping Trivy image."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Download production image artifact
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/production-image

      - name: Load production image artifact
        if: needs.changes.outputs.docs_only != 'true'
        id: load_image
        run: |
          set -euo pipefail
          chmod +x scripts/ci/load-production-image.sh
          # Bewusst kein docker build / build-push-action in diesem Job.
          echo "Trivy Image Scan lädt das Docker-Build-Artefakt; es findet kein zweiter Image-Build statt."
          scripts/ci/load-production-image.sh \
            "${{ runner.temp }}/production-image" \
            "${{ github.sha }}"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' arsnova-eu:production)"
          echo "Gescanntes Image: arsnova-eu:production imageId=$IMAGE_ID"
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Run Trivy image scan
        if: needs.changes.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          # Produktionsartefakt ist arm64-only (#229); Trivy defaultet sonst auf amd64.
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: arsnova-eu:production
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate Trivy image SARIF report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: arsnova-eu:production
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Upload Trivy image report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-image-report
          path: trivy-image.sarif
          if-no-files-found: error
          retention-days: 7

  # ─── GHCR publish (nur main, nach erfolgreichem Scan) ───────────────────────
  # Separater Job: packages:write kommt nicht mit PR-Checkout/Trivy-Skripten zusammen.
  # Check-Name ist neu und bewusst kein Required-Check-Rename (#221).
  publish-image:
    name: Publish Scanned Image
    runs-on: ubuntu-latest
    needs: [changes, trivy-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.push_ghcr.outputs.image_ref }}

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping GHCR publish."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Download production image artifact
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/production-image

      - name: Load scanned production image
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/ci/load-production-image.sh scripts/ci/resolve-pushed-image-ref.sh
          echo "Publish lädt dasselbe Docker-Build-Artefakt erneut; kein Image-Build."
          scripts/ci/load-production-image.sh \
            "${{ runner.temp }}/production-image" \
            "${{ github.sha }}"

      - name: Log in to GHCR
        if: needs.changes.outputs.docs_only != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image to GHCR
        if: needs.changes.outputs.docs_only != 'true'
        id: push_ghcr
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          LOCAL_TAG='arsnova-eu:production'
          LOCAL_ID="$(docker image inspect --format '{{.Id}}' "$LOCAL_TAG")"
          COMMIT_TAG="${IMAGE_NAME}:${GITHUB_SHA}"
          PUSH_LOG="${RUNNER_TEMP}/ghcr-push.log"

          echo "Push des bereits gebauten und gescannten Images (kein Rebuild)."
          echo "localTag=$LOCAL_TAG localImageId=$LOCAL_ID"
          echo "commitTag=$COMMIT_TAG"

          docker tag "$LOCAL_TAG" "$COMMIT_TAG"
          docker push "$COMMIT_TAG" | tee "$PUSH_LOG"

          IMAGE_REF="$(scripts/ci/resolve-pushed-image-ref.sh "$IMAGE_NAME" "$COMMIT_TAG" "$PUSH_LOG")"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Registry-Referenz (kanonisch): $IMAGE_REF"
          echo "Commit-Tag zusätzlich: $COMMIT_TAG"

  # ─── Docker Build (inkl. lokalisiertem Frontend-Build) ──────────────────────
  # Baut das Produktionsimage genau einmal nativ für linux/arm64 (Produktionsserver),
  # führt Runtime-Smokes aus und exportiert dasselbe lokale Image als kurzlebiges
  # Actions-Artefakt für Trivy/GHCR. Kein Multi-Arch-Manifest in diesem Job (#229).
  docker:
    name: Docker Build
    runs-on: ubuntu-24.04-arm
    needs: [changes, build]
    if: github.event_name != 'schedule'

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping Docker build."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Assert native ARM64 runner and Docker host
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/ci/assert-native-arm64.sh
          scripts/ci/assert-native-arm64.sh arm64

      - name: Set up Docker Buildx
        if: needs.changes.outputs.docs_only != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build Docker image
        if: needs.changes.outputs.docs_only != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: false
          load: true
          platforms: linux/arm64
          tags: arsnova-eu:production
          # Separater Cache-Scope, damit amd64-GHA-Cache den ARM64-Build nicht vergiftet.
          cache-from: type=gha,scope=production-arm64
          cache-to: type=gha,mode=max,scope=production-arm64

      - name: Assert built image is linux/arm64
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          scripts/ci/assert-native-arm64.sh arm64 arsnova-eu:production

      - name: Verify hardened production Compose runtime
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          cat > .env.production <<'EOF'
          POSTGRES_USER=arsnova_user
          POSTGRES_PASSWORD=container-smoke-password
          POSTGRES_DB=arsnova_v3
          DATABASE_URL=postgresql://arsnova_user:container-smoke-password@postgres:5432/arsnova_v3?schema=public
          REDIS_URL=redis://redis:6379
          JWT_SECRET=container-smoke-jwt-secret-0000000000000001
          ADMIN_SECRET=container-smoke-admin-secret-00000000000001
          ADMIN_DIAGNOSTIC_SECRET=container-smoke-diagnostic-secret-000000001
          NODE_ENV=production
          HOST=0.0.0.0
          PORT=3000
          WS_PORT=3001
          YJS_WS_PORT=3002
          YJS_WS_HOST=0.0.0.0
          TRUST_PROXY_HOPS=1
          ARSNOVA_IMAGE=arsnova-eu:production
          EOF
          cleanup() {
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              down --volumes --remove-orphans >/dev/null 2>&1 || true
            rm -f .env.production
          }
          trap cleanup EXIT

          docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d app

          for attempt in {1..60}; do
            state="$(docker inspect --format '{{.State.Status}}' arsnova-v3-app)"
            health="$(docker inspect --format '{{.State.Health.Status}}' arsnova-v3-app)"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$state" == "exited" || "$state" == "dead" || "$attempt" -eq 60 ]]; then
              docker compose -f docker-compose.prod.yml --env-file .env.production logs app
              exit 1
            fi
            sleep 2
          done

          docker compose -f docker-compose.prod.yml --env-file .env.production \
            exec -T pdf-worker node /app/scripts/pdf-worker-runtime-smoke.mjs

          # Fail-fast-Lifecycle: Ein non-zero Worker-Exit muss Chromium mitsamt
          # Container beenden, den 0600-Socket neu anlegen und wieder healthy werden.
          worker_restart_policy="$(
            docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' arsnova-v3-pdf-worker
          )"
          if [[ "$worker_restart_policy" != "always" ]]; then
            echo "Unerwartete PDF-Worker-Restart-Policy: $worker_restart_policy"
            exit 1
          fi
          worker_restarts_before="$(
            docker inspect --format '{{.RestartCount}}' arsnova-v3-pdf-worker
          )"
          docker compose -f docker-compose.prod.yml --env-file .env.production \
            exec -T pdf-worker node --input-type=module <<'NODE' || true
          import { readdirSync, readFileSync } from 'node:fs';
          const workerPid = readdirSync('/proc').find((entry) => {
            if (!/^\d+$/.test(entry)) return false;
            try {
              return readFileSync(`/proc/${entry}/cmdline`, 'utf8').startsWith(
                'node\0apps/backend/dist/pdf-worker.js\0',
              );
            } catch {
              return false;
            }
          });
          if (!workerPid) process.exit(2);
          process.kill(Number(workerPid), 'SIGKILL');
          NODE
          for attempt in {1..30}; do
            worker_restarts_after="$(
              docker inspect --format '{{.RestartCount}}' arsnova-v3-pdf-worker
            )"
            worker_health="$(
              docker inspect --format '{{.State.Health.Status}}' arsnova-v3-pdf-worker
            )"
            if [[ "$worker_restarts_after" -gt "$worker_restarts_before" && "$worker_health" == "healthy" ]]; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker compose -f docker-compose.prod.yml --env-file .env.production \
                logs pdf-worker
              exit 1
            fi
            sleep 1
          done

          docker compose -f docker-compose.prod.yml --env-file .env.production \
            exec -T app node /app/scripts/container-runtime-smoke.mjs

          # Produktionsimage/Compose: Yjs-Protokoll, Offline-Update und Reconnect
          # gegen den gehärteten Relay auf dem tatsächlich veröffentlichten Port.
          docker compose -f docker-compose.prod.yml --env-file .env.production \
            exec -T \
            -e YJS_WS_URL=ws://127.0.0.1:3002 \
            -e CLIENTS=30 \
            -e UPDATE_CONCURRENCY=15 \
            app node --input-type=module < scripts/load/yjs-sync-load.mjs

      - name: Export production image artifact
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' arsnova-eu:production)"
          echo "Einziger Produktionsimage-Build dieses Workflows: imageId=$IMAGE_ID"
          chmod +x scripts/ci/save-production-image.sh
          scripts/ci/save-production-image.sh \
            arsnova-eu:production \
            "${{ runner.temp }}/production-image" \
            "${{ github.sha }}"

      - name: Upload production image artifact
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/production-image/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # ─── Deploy Freshness Check (nur aktueller main-HEAD darf deployen) ──────────
  deploy-freshness:
    name: Deploy Freshness Check
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        actionlint,
        format,
        migration,
        landing-build,
        lint,
        test,
        pdfua,
        docker,
        typecheck,
        lighthouse,
        e2e,
        classroom-smokes,
        audit,
        trivy-fs,
        trivy-image,
        publish-image,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && needs.changes.outputs.docs_only != 'true'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - name: Check current main head
        id: check
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          if [[ "$current_main_sha" != "$DEPLOY_SHA" ]]; then
            echo "Deploy SHA $DEPLOY_SHA ist nicht mehr aktueller main-HEAD ($current_main_sha); Deploy wird übersprungen."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Deploy SHA ist aktueller main-HEAD: $DEPLOY_SHA"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  # ─── Deploy (nur Push auf main, nach allen Qualitäts-Gates) ───────────────────
  # Läuft nur, wenn Repository-Variable DEPLOY_ENABLED = 'true' gesetzt ist.
  # Ohne Server: Variable weglassen → Deploy wird übersprungen, CI bleibt grün.
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [deploy-freshness, publish-image]
    if: needs.deploy-freshness.outputs.should_deploy == 'true'
    timeout-minutes: 30
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    environment:
      name: production

    env:
      DEPLOY_DIR: /home/deploy/arsnova.eu
      DEPLOY_BRANCH: main
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_IMAGE: ${{ needs.publish-image.outputs.image_ref }}

    steps:
      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}" || (echo "Missing secret: DEPLOY_HOST" && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "Missing secret: DEPLOY_USER" && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "Missing secret: DEPLOY_SSH_KEY" && exit 1)
          test -n "${DEPLOY_IMAGE}" || (echo "Missing DEPLOY_IMAGE from publish-image.outputs.image_ref" && exit 1)
          echo "Deploy configuration looks complete."
          echo "DEPLOY_IMAGE=${DEPLOY_IMAGE}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: DEPLOY_DIR,DEPLOY_BRANCH,DEPLOY_SHA,DEPLOY_IMAGE
          script: |
            set -e
            export DEPLOY_DIR="${DEPLOY_DIR:-/home/deploy/arsnova.eu}"
            export DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
            export DEPLOY_SHA="$DEPLOY_SHA"
            export DEPLOY_IMAGE="$DEPLOY_IMAGE"
            cd "$DEPLOY_DIR"
            # Bootstrap: Ziel-Commit AUSCHECKEN, bevor deploy.sh startet.
            # Sonst würde der erste Post-Merge-Lauf noch das alte 1B-Skript
            # (compose build) aus dem vorherigen Working Tree ausführen.
            # Inline (nicht checkout-deploy-sha.sh), weil das Helper-Skript
            # auf dem Server erst nach diesem Checkout vorhanden sein kann.
            git fetch --prune origin "$DEPLOY_BRANCH"
            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "$DEPLOY_SHA"
            fi
            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "Fehler: Ziel-Commit $DEPLOY_SHA konnte nicht gefunden werden."
              exit 1
            fi
            git checkout --detach --force "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

  # ─── Post-Deploy Smoke Check ───────────────────────────────────────────────
  post-deploy-smoke:
    name: Post-Deploy Smoke Check
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Verify production serving
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail

          if printf '%s' "$DEPLOY_HOST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "DEPLOY_HOST ist eine IP-Adresse ($DEPLOY_HOST). TLS-Zertifikate enthalten i. d. R. DNS-Namen, nicht IP-SANs."
            echo "Setze DEPLOY_HOST auf den öffentlichen DNS-Namen mit gültigem Zertifikat (z. B. arsnova.eu)."
            exit 1
          fi

          SMOKE_URL="https://$DEPLOY_HOST"
          node scripts/verify-production-serving.mjs "$SMOKE_URL"

  # ─── Rollback (wenn Post-Deploy-Smoke fehlschlägt) ───────────────────────
  # Nutzt previous image+sha aus dem serverseitigen Deploy-State — nicht github.event.before.
  rollback-on-smoke-failure:
    name: Rollback on Smoke Failure
    runs-on: ubuntu-latest
    needs: [deploy, post-deploy-smoke]
    # Run only for real push deployments on main when the smoke test failed.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && needs.post-deploy-smoke.result == 'failure' }}
    timeout-minutes: 30
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    environment:
      name: production

    env:
      DEPLOY_DIR: /home/deploy/arsnova.eu
      DEPLOY_BRANCH: main

    steps:
      - name: Validate rollback configuration
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}" || (echo "Missing secret: DEPLOY_HOST" && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "Missing secret: DEPLOY_USER" && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "Missing secret: DEPLOY_SSH_KEY" && exit 1)
          echo "Rollback configuration looks complete (previous image+sha from server deploy state)."

      - name: Roll back via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: DEPLOY_DIR,DEPLOY_BRANCH
          script: |
            set -e
            export DEPLOY_DIR="${DEPLOY_DIR:-/home/deploy/arsnova.eu}"
            export DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
            cd "$DEPLOY_DIR"
            # Kein Checkout vor dem Skript: das installierte 1C-Skript muss
            # zuerst previous.state lesen; erst danach checkt es den Previous-SHA aus.
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh --rollback
