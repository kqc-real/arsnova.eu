          set -euo pipefail
          if [ "$CHROMIUM_RESULT" != 'success' ] || [ "$WEBKIT_RESULT" != 'success' ]; then
            echo "Browser-E2E fehlgeschlagen: chromium=$CHROMIUM_RESULT webkit=$WEBKIT_RESULT"
            if [ "$CHROMIUM_RESULT" = 'cancelled' ] || [ "$WEBKIT_RESULT" = 'cancelled' ]; then
              echo "cancelled bedeutet meist Job-Timeout (z. B. hängendes Playwright-Install)."
            fi
            exit 1
          fi
          echo "Browser-E2E bestanden: chromium=$CHROMIUM_RESULT webkit=$WEBKIT_RESULT"

  # ─── Classroom Scenario Smokes (tRPC, Postgres + Redis, Backend only) ───────
  classroom-smokes:
    name: Classroom Scenario Smokes
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: github.event_name != 'schedule'
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arsnova_user
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: arsnova_v3_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arsnova_user -d arsnova_v3_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: arsnova_user
      DB_PASSWORD: secretpassword
      DB_NAME: arsnova_v3_dev
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      ADMIN_SECRET: ci-admin-secret
      ADMIN_DIAGNOSTIC_SECRET: ci-diagnostic-secret-distinct-from-admin-0001
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      WS_PORT: 3001
      YJS_WS_PORT: 3002
      TRPC_URL: http://localhost:3000/trpc
      WS_URL: ws://localhost:3001

    steps:
      - name: Docs-only fast pass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change — skipping classroom smokes."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js 24
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Prisma generate
        if: needs.changes.outputs.docs_only != 'true'
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply production migrations
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/${DB_NAME}?schema=public"
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Build libs
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run build:libs

      - name: Session-create budget Redis regression
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: apps/backend
        env:
          RUN_REDIS_SESSION_CREATE_TESTS: '1'
          RATE_LIMIT_SESSION_CREATE_PER_HOUR: '3'
          RATE_LIMIT_SESSION_CREATE_GLOBAL_PER_HOUR: '5'
        run: npx vitest run src/lib/rateLimit.sessionCreate.redis.test.ts

      - name: Admin-login protection Redis regression
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: apps/backend
        env:
          RUN_REDIS_ADMIN_LOGIN_TESTS: '1'
          RATE_LIMIT_ADMIN_LOGIN_WINDOW_SECONDS: '30'
          RATE_LIMIT_ADMIN_LOGIN_GLOBAL_ATTEMPTS_PER_WINDOW: '5'
          RATE_LIMIT_ADMIN_LOGIN_DELAY_BASE_MS: '10'
          RATE_LIMIT_ADMIN_LOGIN_DELAY_MAX_MS: '80'
        run: npx vitest run src/lib/adminLoginProtection.redis.test.ts

      - name: Session-code protection Redis regression
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: apps/backend
        env:
          RUN_REDIS_SESSION_CODE_TESTS: '1'
          RATE_LIMIT_SESSION_CODE_WINDOW_SECONDS: '30'
          RATE_LIMIT_SESSION_CODE_CLIENT_FAILURES_PER_WINDOW: '3'
          RATE_LIMIT_SESSION_CODE_CODE_SOFT_CAP_PER_WINDOW: '5'
          RATE_LIMIT_SESSION_CODE_GLOBAL_SOFT_CAP_PER_WINDOW: '10'
          RATE_LIMIT_SESSION_CODE_DELAY_BASE_MS: '10'
          RATE_LIMIT_SESSION_CODE_DELAY_MAX_MS: '20'
        run: npx vitest run src/lib/sessionCodeProtection.redis.test.ts

      - name: Run classroom scenario smokes
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/${DB_NAME}?schema=public"
          REPORT_DIR="$RUNNER_TEMP/classroom-smokes"
          mkdir -p "$REPORT_DIR"
          cleanup() {
            if [ -f "$RUNNER_TEMP/backend.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          npm run dev -w @arsnova/backend > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/trpc/health.check >/dev/null; then
              if kill -0 "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null; then
                break
              fi
              echo "Backend-Prozess ist beendet."
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Backend-Server konnte nicht gestartet werden."
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 1
          done

          REPORT_FILE="$REPORT_DIR/blitzlicht.json" JUNIT_FILE="$REPORT_DIR/blitzlicht.junit.xml" npm run load:smoke:blitzlicht-classroom-30
          REPORT_FILE="$REPORT_DIR/qa.json" JUNIT_FILE="$REPORT_DIR/qa.junit.xml" npm run load:smoke:qa-classroom-30
          REPORT_FILE="$REPORT_DIR/demo-quiz.json" JUNIT_FILE="$REPORT_DIR/demo-quiz.junit.xml" npm run load:smoke:demo-classroom-30
          REPORT_FILE="$REPORT_DIR/ws-vote-progress.json" JUNIT_FILE="$REPORT_DIR/ws-vote-progress.junit.xml" npm run load:smoke:ws-vote-progress-classroom-30
          REPORT_FILE="$REPORT_DIR/ws-reconnect-wave.json" JUNIT_FILE="$REPORT_DIR/ws-reconnect-wave.junit.xml" npm run load:smoke:ws-reconnect-wave-classroom-30
          REPORT_FILE="$REPORT_DIR/channel-ws-fanout.json" JUNIT_FILE="$REPORT_DIR/channel-ws-fanout.junit.xml" npm run load:smoke:channel-ws-fanout-classroom-30

      - name: Upload classroom smoke reports
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: classroom-smoke-reports
          path: |
            ${{ runner.temp }}/classroom-smokes/
            ${{ runner.temp }}/backend.log
          if-no-files-found: ignore
          retention-days: 7

  # ─── Artillery 500 Live Session (scheduled/manual, local or staging) ────────
  artillery-500:
    name: Artillery 500 Live Session
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arsnova_user
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: arsnova_v3_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arsnova_user -d arsnova_v3_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: arsnova_user
      DB_PASSWORD: secretpassword
      DB_NAME: arsnova_v3_dev
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret
      ADMIN_SECRET: ci-admin-secret
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      WS_PORT: 3001
      YJS_WS_PORT: 3002
      TRPC_URL: http://localhost:3000/trpc
      WS_URL: ws://localhost:3001
      PARTICIPANTS: ${{ inputs.artillery_participants || vars.ARTILLERY_PARTICIPANTS || '500' }}
      ARTILLERY_RAMP_SECONDS: ${{ inputs.artillery_ramp_seconds || vars.ARTILLERY_RAMP_SECONDS || '60' }}

    steps:
      - name: Generate ephemeral diagnostic secret
        run: |
          diagnostic_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$diagnostic_secret"
          echo "ADMIN_DIAGNOSTIC_SECRET=$diagnostic_secret" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply production migrations
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/${DB_NAME}?schema=public"
          npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Build libs
        run: npm run build:libs

      - name: Run Artillery live session and heavy vote smokes
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/${DB_NAME}?schema=public"
          REPORT_DIR="$RUNNER_TEMP/artillery-500"
          mkdir -p "$REPORT_DIR"
          # shellcheck disable=SC2317,SC2329
          cleanup() {
            if [ -f "$RUNNER_TEMP/backend.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          npm run dev -w @arsnova/backend > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/trpc/health.check >/dev/null; then
              if kill -0 "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null; then
                break
              fi
              echo "Backend-Prozess ist beendet."
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Backend-Server konnte nicht gestartet werden."
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 1
          done

          run_status=0
          # Timer-Fairness zuerst (frisches Backend); Runner-Latenzgates lockerer als lokal (1000/2000 ms).
          # Eigener Undici-Dispatcher (VOTE_HTTP_CONNECTIONS=600) und WITHIN_GRACE_REVEAL_OFFSET_MS=0
          # fuer kontrollierten Burst bzw. maximalen Karenz-Rest auf dem lokalen Runner.
          # 4000 ms: Nightly 2026-08-15 Karenz-p95 3046 / p99 3095 bei fachlich 600/600;
          # der Vortag lag bei 2828 ms. Das 3000-ms-Gate war fuer Runner-Varianz zu eng.
          REPORT_FILE="$REPORT_DIR/vote-timer-fairness-600.json" JUNIT_FILE="$REPORT_DIR/vote-timer-fairness-600.junit.xml" VOTE_P95_LIMIT_MS=4000 VOTE_P99_LIMIT_MS=4000 VOTE_HTTP_CONNECTIONS=600 WITHIN_GRACE_REVEAL_OFFSET_MS=0 PARTICIPANTS=600 npm run load:smoke:vote-timer-fairness || run_status=$?
          REPORT_FILE="$REPORT_DIR/host-vote-progress-200.json" JUNIT_FILE="$REPORT_DIR/host-vote-progress-200.junit.xml" VOTE_P95_LIMIT_MS=2000 PARTICIPANTS=200 npm run load:smoke:host-vote-progress || run_status=$?
          REPORT_FILE="$REPORT_DIR/summary.json" JUNIT_FILE="$REPORT_DIR/summary.junit.xml" npm run load:artillery:500 || run_status=$?
          REPORT_FILE="$REPORT_DIR/yjs-sync.json" JUNIT_FILE="$REPORT_DIR/yjs-sync.junit.xml" CLIENTS=30 npm run load:yjs:sync || run_status=$?
          REPORT_FILE="$REPORT_DIR/freetext-wordcloud.json" JUNIT_FILE="$REPORT_DIR/freetext-wordcloud.junit.xml" PARTICIPANTS=100 ITERATIONS=3 npm run load:freetext:wordcloud || run_status=$?
          REPORT_FILE="$REPORT_DIR/soak-live-session.json" JUNIT_FILE="$REPORT_DIR/soak-live-session.junit.xml" SOAK_DURATION_MINUTES=5 SOAK_BACKEND_PID="$(cat "$RUNNER_TEMP/backend.pid")" SOAK_REDIS_URL=redis://127.0.0.1:6379 SOAK_DATABASE_URL="$DATABASE_URL" npm run load:soak:live-session || run_status=$?
          cp -R scripts/load/artillery/reports "$REPORT_DIR/" 2>/dev/null || true
          exit "$run_status"

      - name: Upload Artillery reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artillery-500-reports
          path: |
            ${{ runner.temp }}/artillery-500/
            ${{ runner.temp }}/backend.log
          if-no-files-found: ignore
          retention-days: 30

