# Opt-in über STAGING_TEXT_ANALYSIS=true ./scripts/staging-compose.sh.
x-encoder-client: &encoder-client
  environment:
    WORD_CLOUD_SEMANTIC_ENABLED: 'true'
    WORD_CLOUD_ENCODER_SOCKET_PATH: /run/wordcloud-encoder/encoder.sock
  depends_on:
    encoder:
      condition: service_healthy
  volumes:
    - encoder_socket:/run/wordcloud-encoder:ro
    - ./deploy/staging/text-analysis-readiness.mjs:/app/staging-text-analysis-readiness.mjs:ro

services:
  app-a: *encoder-client
  app-b: *encoder-client

  encoder:
    image: ${STAGING_ENCODER_IMAGE:?Staging-Encoder-Image fehlt}
    init: true
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: '2.0'
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - encoder_socket:/run/wordcloud-encoder

volumes:
  encoder_socket:
